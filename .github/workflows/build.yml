name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build workflows
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: alfred-workflows
          path: dist/*.alfredworkflow
